name: ai-agent-orchestrator
x-backend: &backend
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator
    REDIS_URL: redis://redis:6379
    MOCK_LLM: ${MOCK_LLM:-true}
    MOCK_CHUNK_DELAY_MS: ${MOCK_CHUNK_DELAY_MS:-45}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *backend
    command: ["sh", "-c", "node apps/api/dist/database/migrate.js && node apps/api/dist/main.js"]
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *backend
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 60s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
