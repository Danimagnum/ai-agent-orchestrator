name: Publish verified images
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker archive for Synology
        env:
          APP: ${{ matrix.app }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${APP}:${COMMIT}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false -f "apps/$APP/Dockerfile" -t "$image" --output type=docker,dest=image.tar .
          tar -tf image.tar | grep -qx manifest.json
          docker load -i image.tar
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
      - name: Publish commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
      - name: Compress and verify NAS archive
        run: |
          gzip -n image.tar
          sha256sum image.tar.gz > image.tar.gz.sha256
          sha256sum -c image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nas-${{ matrix.app }}-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          path: |
            image.tar.gz
            image.tar.gz.sha256
