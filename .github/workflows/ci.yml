name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  images:
    needs: [verify, containers, secrets]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: orchestrator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://orchestrator:orchestrator@localhost:5432/orchestrator
      REDIS_URL: redis://localhost:6379
      MOCK_LLM: "true"
      MOCK_CHUNK_DELAY_MS: "30"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @orchestrator/api migrate
      - name: Start API and worker
        run: |
          node apps/api/dist/main.js > /tmp/orchestrator-api.log 2>&1 &
          node apps/api/dist/worker.js > /tmp/orchestrator-worker.log 2>&1 &
          node -e "const wait=async()=>{for(let i=0;i<60;i++){try{if((await fetch('http://localhost:4000/health')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()"
      - run: pnpm --filter @orchestrator/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_LLM: "true"
      MOCK_CHUNK_DELAY_MS: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start the complete stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify UI, queue, worker, database and streamed events
        run: node scripts/smoke-compose.mjs
      - name: Verify persisted metrics and readiness
        run: node scripts/check-observability.mjs
      - name: Verify metrics test catches corrupted accounting
        run: |
          docker compose exec -T --user root api cp apps/api/dist/observability/controller.js /tmp/observability-original.js
          docker compose exec -T --user root api node -e 'const fs=require("fs"); const p="apps/api/dist/observability/controller.js"; const s=fs.readFileSync(p,"utf8"); const mutated=s.replace(/SUM\("promptTokens"\) AS input/, "0 AS input"); if(s===mutated)process.exit(2); fs.writeFileSync(p,mutated);'
          docker compose restart api
          docker compose up -d --wait --wait-timeout 180
          if node scripts/check-observability.mjs > /tmp/metrics-mutation.log 2>&1; then
            echo "Metrics test accepted corrupted accounting"
            exit 1
          fi
          cat /tmp/metrics-mutation.log
          grep -q 'Incorrect input_tokens' /tmp/metrics-mutation.log
      - name: Restore metrics implementation
        if: always()
        run: |
          docker compose exec -T --user root api cp /tmp/observability-original.js apps/api/dist/observability/controller.js
          docker compose restart api
          docker compose up -d --wait --wait-timeout 180
          node scripts/check-observability.mjs
      - name: Inject Redis failure
        run: |
          docker compose stop redis
          EXPECT_READY=redis node scripts/check-observability.mjs
      - name: Restore Redis
        if: always()
        run: docker compose start redis && docker compose up -d --wait --wait-timeout 180
      - name: Inject PostgreSQL failure
        run: |
          docker compose stop postgres
          EXPECT_READY=postgres node scripts/check-observability.mjs
      - name: Restore PostgreSQL and verify recovery
        if: always()
        run: |
          docker compose start postgres
          docker compose up -d --wait --wait-timeout 180
          node scripts/check-observability.mjs
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > /tmp/orchestrator-containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-logs
          path: /tmp/orchestrator-containers.log
      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history (redacted)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 detect --source=/repo --redact --no-banner
      - name: Verify scanner rejects an injected credential
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/secret-canary"
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'secret-canary', 'canary.txt').write_text('token = "' + 'gh' + 'p_' + 'Ab3dE5fG7hJ9kL2mN4pQ6rS8tU0vW1xY3zA5' + '"\n')
          PY
          set +e
          docker run --rm -v "$RUNNER_TEMP/secret-canary:/repo:ro" zricethezav/gitleaks:v8.24.3 detect --no-git --source=/repo --redact --no-banner
          result=$?
          set -e
          test "$result" -eq 1
